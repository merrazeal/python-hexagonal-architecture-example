name: payment-e2e

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env.e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    env_file:
      - .env.e2e
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile.test
    env_file:
      - .env.e2e
    command: alembic --config src/adapters/db/alembic/alembic.ini upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile.test
    env_file:
      - .env.e2e
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: docker/worker/Dockerfile.test
    env_file:
      - .env.e2e
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('rabbitmq', 5672)))"]
      interval: 5s
      timeout: 5s
      retries: 10

  cron:
    build:
      context: ../..
      dockerfile: docker/cron/Dockerfile.test
    env_file:
      - .env.e2e
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('rabbitmq', 5672)))"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    env_file:
      - .env.e2e
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
      cron:
        condition: service_healthy
