services:
  postgres:
    image: postgres:15-alpine
    container_name: payment_postgres
    restart: always
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: payment_rabbitmq
    restart: always
    env_file:
      - .env.dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: payment_migrations
    restart: no
    env_file:
      - .env.dev
    command: alembic --config src/adapters/db/alembic/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: payment_web
    restart: always
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:9090:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile.dev
    container_name: payment_worker
    restart: always
    env_file:
      - .env.dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('rabbitmq', 5672)))"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile.dev
    container_name: payment_scheduler
    restart: always
    env_file:
      - .env.dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('rabbitmq', 5672)))"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  rabbitmq_data:
